# Builds a signed arm64 Android APK for the private SimpleX fork.
#
# The native libraries (libsimplex.so, libsupport.so) are not committed to the
# repo, so they are downloaded prebuilt from CI and placed where the CMake
# build expects them (common/src/commonMain/cpp/android/libs/<abi>/).
# The fossRelease APK is unsigned by Gradle (no signing config in
# build.gradle.kts), so the workflow signs it with a throwaway debug keystore
# generated at build time, then uploads the signed APK as an artifact.

name: Build Android APK

on:
  push:
    branches:
      - stable
    paths:
      - 'apps/multiplatform/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build signed fossRelease APK (arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prebuilt native libraries (arm64-v8a)
        run: |
          set -euo pipefail
          LIBS_DIR="apps/multiplatform/common/src/commonMain/cpp/android/libs/arm64-v8a"
          mkdir -p "$LIBS_DIR"
          curl -sSL --fail -o /tmp/libsimplex.zip \
            "https://ci.zw3rk.com/build/494539/download/1/pkg-aarch64-android-libsimplex.zip"
          curl -sSL --fail -o /tmp/libsupport.zip \
            "https://ci.zw3rk.com/build/482524/download/1/pkg-aarch64-android-libsupport.zip"
          unzip -o /tmp/libsimplex.zip -d "$LIBS_DIR"
          unzip -o /tmp/libsupport.zip -d "$LIBS_DIR"
          # Flatten in case the zips wrap the .so files in subdirectories
          find "$LIBS_DIR" -mindepth 2 -name '*.so' -exec mv -t "$LIBS_DIR" {} +
          test -f "$LIBS_DIR/libsimplex.so"
          test -f "$LIBS_DIR/libsupport.so"
          ls -la "$LIBS_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build fossRelease APK
        working-directory: apps/multiplatform
        run: |
          chmod +x gradlew
          ./gradlew :android:assembleFossRelease --no-daemon

      - name: Sign, align and rename APK
        run: |
          set -euo pipefail
          VERSION="$(grep '^android.version_name=' apps/multiplatform/gradle.properties | cut -d= -f2)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          APK_DIR="apps/multiplatform/android/build/outputs/apk/foss/release"
          UNSIGNED_APK="$(ls "$APK_DIR"/*arm64-v8a*.apk | head -n 1)"
          echo "Unsigned APK: ${UNSIGNED_APK}"

          # Throwaway debug keystore: makes the APK installable, not a release identity
          keytool -genkeypair -v \
            -keystore /tmp/debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS="$(ls -d "${SDK}"/build-tools/* | sort -V | tail -n 1)"
          ZIPALIGN="${BUILD_TOOLS}/zipalign"
          APKSIGNER="${BUILD_TOOLS}/apksigner"

          OUT_APK="${APK_DIR}/simplex-private-${VERSION}-arm64.apk"
          "${ZIPALIGN}" -f 4 "${UNSIGNED_APK}" /tmp/aligned.apk
          "${APKSIGNER}" sign \
            --ks /tmp/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "${OUT_APK}" /tmp/aligned.apk
          "${APKSIGNER}" verify --print-certs "${OUT_APK}"
          "${ZIPALIGN}" -c 4 "${OUT_APK}"
          ls -la "${OUT_APK}"
          echo "APK_PATH=${OUT_APK}" >> "$GITHUB_ENV"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: simplex-private-${{ env.VERSION }}-arm64
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
