# Builds a signed arm64 Android APK for Ciphertext (private fork of SimpleX Chat).
#
# The native libraries (libsimplex.so, libsupport.so) are not committed to the
# repo, so they are extracted from the upstream release APK and placed where the CMake
# build expects them (common/src/commonMain/cpp/android/libs/<abi>/).
# The fossRelease APK is unsigned by Gradle (no signing config in
# build.gradle.kts), so the workflow signs it with the stable release key
# from GitHub Secrets (one key for ALL releases), then uploads the signed
# APK as an artifact. It fails closed if the secrets are missing: it never
# falls back to a throwaway key, or releases would get different keys again
# and stop updating in place.

name: Build Android APK

on:
  push:
    branches:
      - stable
    paths:
      - 'apps/multiplatform/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build signed fossRelease APK (arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Verify secret SHA (fast fail)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > /tmp/release.p12
          echo "DIAG early_keystore_b64_len=${#ANDROID_KEYSTORE_BASE64}"
          echo "DIAG early_decoded_bytes=$(stat -c%s /tmp/release.p12)"
          echo "DIAG early_keystore_b64_sha256=$(printf '%s' "${ANDROID_KEYSTORE_BASE64}" | sha256sum | cut -d' ' -f1)"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract native libraries from upstream APKs (arm64-v8a + armeabi-v7a)
        # The prebuilt CI zips (ci.zw3rk.com) are no longer available (404).
        # Extract libsimplex.so and libsupport.so from the upstream release APKs
        # instead. The JNI interface is stable, so the v7.0.3 libs work with
        # this fork's Kotlin code. Both ABIs are needed: the Gradle build sets
        # abiFilters("arm64-v8a", "armeabi-v7a"), so CMake requires prebuilt
        # libs for each ABI or ninja fails with "no known rule to make" errors.
        run: |
          set -euo pipefail
          extract_abi() {
            local apk_url="$1" abi="$2"
            local libs_dir="apps/multiplatform/common/src/commonMain/cpp/android/libs/$abi"
            mkdir -p "$libs_dir"
            curl -sSL --fail -o /tmp/simplex-abi.apk "$apk_url"
            rm -rf /tmp/sx-libs && mkdir -p /tmp/sx-libs
            unzip -o /tmp/simplex-abi.apk "lib/$abi/*" -d /tmp/sx-libs/
            cp "/tmp/sx-libs/lib/$abi/libsimplex.so" "/tmp/sx-libs/lib/$abi/libsupport.so" "$libs_dir/"
            test -f "$libs_dir/libsimplex.so"
            test -f "$libs_dir/libsupport.so"
            ls -la "$libs_dir"
          }
          extract_abi "https://github.com/simplex-chat/simplex-chat/releases/download/v7.0.3/simplex-aarch64.apk" "arm64-v8a"
          extract_abi "https://github.com/simplex-chat/simplex-chat/releases/download/v7.0.3/simplex-armv7a.apk" "armeabi-v7a"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests
        working-directory: apps/multiplatform
        env:
          GRADLE_OPTS: "-Xmx6g"
        run: |
          chmod +x gradlew
          ./gradlew :android:testFossReleaseUnitTest --no-daemon

      - name: Build fossRelease APK
        working-directory: apps/multiplatform
        env:
          GRADLE_OPTS: "-Xmx6g"
        run: |
          chmod +x gradlew
          ./gradlew :android:assembleFossRelease -Pciphertext.build_number=${{ github.run_number }} --no-daemon

      - name: Sign, align and rename APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          VERSION="$(grep '^android.version_name=' apps/multiplatform/gradle.properties | cut -d= -f2)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          APK_DIR="apps/multiplatform/android/build/outputs/apk/foss/release"
          UNSIGNED_APK="$(ls "$APK_DIR"/*arm64-v8a*.apk | head -n 1)"
          echo "Unsigned APK: ${UNSIGNED_APK}"

          # Stable release key from GitHub Secrets (one key for ALL releases).
          # Fail closed: never fall back to a throwaway key.
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "ERROR: release signing secrets are not set (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS). Refusing to sign with a throwaway key." >&2
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > /tmp/release.p12

          # Diagnostics: lengths + DER magic bytes ONLY, never secret material.
          # Distinguishes truncated/wrong value (small len, non-DER magic)
          # from wrong password (plausible len, DER magic 30 82).
          echo "DIAG keystore_b64_len=${#ANDROID_KEYSTORE_BASE64}"
          echo "DIAG decoded_bytes=$(stat -c%s /tmp/release.p12)"
          echo "DIAG first_bytes=$(head -c 4 /tmp/release.p12 | od -An -tx1 | tr -d ' \n')"

          # The three secrets are present at this point (the empty check above
          # passed), but the decoded bytes must actually be a PKCS12 keystore.
          # Validate before apksigner so a corrupt stored value fails here
          # with a precise message instead of an opaque DER parse error.
          # DIAG: SHA-256 of the received base64 value (hash only, never the secret).
          # Compare with the SHA-256 computed locally before pasting to prove
          # the exact value that landed in GitHub Secrets.
          echo "DIAG keystore_b64_sha256=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | sha256sum | cut -d' ' -f1)"

          # Decisive diagnostic: separate wrong-password from format incompatibility.
          # keytool stderr is printed (it names the failure, never the password).
          # openssl is tried with the same stored password as a second opinion.
          # asn1parse identifies the container type (PKCS#12 vs cert vs PKCS#7).
          openssl asn1parse -inform DER -in /tmp/release.p12 2>&1 | head -n 12 | sed 's/^/DIAG asn1: /'
          KEYTOOL_BIN="${JAVA_HOME:-/usr/lib/jvm/default-java}/bin/keytool"
          if [ ! -x "$KEYTOOL_BIN" ]; then KEYTOOL_BIN="keytool"; fi
          set +e
          KEYTOOL_OUT="$("$KEYTOOL_BIN" -list -keystore /tmp/release.p12 -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>&1)"
          KEYTOOL_RC=$?
          set -e
          if [ "$KEYTOOL_RC" -ne 0 ]; then
            echo "DIAG keytool_error:"
            echo "$KEYTOOL_OUT"
          fi
          if openssl pkcs12 -info -noout -in /tmp/release.p12 -passin "pass:$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "DIAG openssl_opens_keystore=yes"
          else
            echo "DIAG openssl_opens_keystore=no"
          fi
          if [ "$KEYTOOL_RC" -ne 0 ]; then
            echo "ERROR: stored ANDROID_KEYSTORE_BASE64 does not decode to an openable PKCS12 keystore (corrupt value, or wrong ANDROID_KEYSTORE_PASSWORD). Re-set the secret in repo Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS="$(ls -d "${SDK}"/build-tools/* | sort -V | tail -n 1)"
          ZIPALIGN="${BUILD_TOOLS}/zipalign"
          APKSIGNER="${BUILD_TOOLS}/apksigner"

          OUT_APK="${APK_DIR}/ciphertext-${VERSION}-arm64.apk"
          "${ZIPALIGN}" -f 4 "${UNSIGNED_APK}" /tmp/aligned.apk
          "${APKSIGNER}" sign \
            --ks /tmp/release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --out "${OUT_APK}" /tmp/aligned.apk
          "${APKSIGNER}" verify --print-certs "${OUT_APK}"
          "${ZIPALIGN}" -c 4 "${OUT_APK}"
          ls -la "${OUT_APK}"
          echo "APK_PATH=${OUT_APK}" >> "$GITHUB_ENV"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ciphertext-${{ env.VERSION }}-arm64
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ env.VERSION }}-ciphertext.${{ github.run_number }}"
          gh release create "$TAG" \
            --target stable \
            --title "Ciphertext v${{ env.VERSION }}" \
            --notes "Ciphertext v${{ env.VERSION }} (run ${{ github.run_number }}). Ciphertext is a fork of SimpleX Chat, licensed under AGPLv3, with 1:1 live ephemeral sessions.$(printf '\n\n- 1:1 live ephemeral sessions with 10s heartbeat / 30s timeout\n- Disconnect destroys the session; dead sessions are never resumed\n- Both clients auto-establish a fresh session with zero carryover\n- Group chat UI removed (1:1 only)\n\nSigned fossRelease APK (arm64).')" \
            --prerelease \
            "${{ env.APK_PATH }}"
