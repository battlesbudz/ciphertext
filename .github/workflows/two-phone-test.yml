# Two-phone test: two emulators run the APK and verify live ephemeral sessions.
#
# Proves (a) both phones onboard, (b) a 1:1 session is established via
# invitation, (c) messages flow both ways, (d) heartbeats stay invisible,
# (e) killing one phone wipes the session on the other, (f) a brand-new
# session is re-established, (g) zero carryover into the new session.
#
# Test infrastructure ONLY. Does not modify app code or the release workflow.
#
# Two jobs, split by host arch:
# - build-apk (ubuntu-latest x86_64): builds + signs the APK from the
#   current commit (same steps as android-apk.yml) and uploads it.
#   The build MUST stay on x86_64: AGP resolves AAPT2 from Maven as an
#   x86_64-only binary (com.android.tools.build:aapt2:<ver>:linux, no
#   linux-aarch64 variant), and it fails on ARM64 hosts with
#   "AAPT2 ... Daemon startup failed".
# - two-phone-test (ubuntu-24.04-arm): downloads the APK and runs two
#   arm64-v8a emulators NATIVELY. The x86_64-runner path ran the APK via
#   the houdini native bridge, but the app hung on "Opening database…"
#   for 300s+ under translation (run 38658640258). Native arm64 removes
#   that variable. Maestro 1.39.0 is a JVM app (JARs + shell launcher),
#   so it runs on ARM64 Linux with Java 17.
#
# Triggers: manual dispatch, or pushes touching the test files / workflow.

name: Two-Phone Test

on:
  workflow_dispatch:
  push:
    branches:
      - stable
    paths:
      - '.github/workflows/two-phone-test.yml'
      - 'tests/two-phone/**'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build + sign APK (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract native libraries from upstream APKs (arm64-v8a + armeabi-v7a)
        run: |
          set -euo pipefail
          extract_abi() {
            local apk_url="$1" abi="$2"
            local libs_dir="apps/multiplatform/common/src/commonMain/cpp/android/libs/$abi"
            mkdir -p "$libs_dir"
            curl -sSL --fail -o /tmp/simplex-abi.apk "$apk_url"
            rm -rf /tmp/sx-libs && mkdir -p /tmp/sx-libs
            unzip -o /tmp/simplex-abi.apk "lib/$abi/*" -d /tmp/sx-libs/
            cp "/tmp/sx-libs/lib/$abi/libsimplex.so" "/tmp/sx-libs/lib/$abi/libsupport.so" "$libs_dir/"
            test -f "$libs_dir/libsimplex.so"
            test -f "$libs_dir/libsupport.so"
          }
          extract_abi "https://github.com/simplex-chat/simplex-chat/releases/download/v7.0.3/simplex-aarch64.apk" "arm64-v8a"
          extract_abi "https://github.com/simplex-chat/simplex-chat/releases/download/v7.0.3/simplex-armv7a.apk" "armeabi-v7a"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build fossRelease APK
        working-directory: apps/multiplatform
        run: |
          chmod +x gradlew
          ./gradlew :android:assembleFossRelease --no-daemon --stacktrace

      - name: Sign APK (throwaway debug keystore, installable only)
        run: |
          set -euo pipefail
          VERSION="$(grep '^android.version_name=' apps/multiplatform/gradle.properties | cut -d= -f2)"
          APK_DIR="apps/multiplatform/android/build/outputs/apk/foss/release"
          UNSIGNED_APK="$(ls "$APK_DIR"/*arm64-v8a*.apk | head -n 1)"
          keytool -genkeypair -v \
            -keystore /tmp/debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS="$(ls -d "${SDK}"/build-tools/* | sort -V | tail -n 1)"
          "${BUILD_TOOLS}/zipalign" -f 4 "${UNSIGNED_APK}" /tmp/aligned.apk
          "${BUILD_TOOLS}/apksigner" sign \
            --ks /tmp/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "${APK_DIR}/simplex-private-${VERSION}-arm64.apk" /tmp/aligned.apk
          "${BUILD_TOOLS}/apksigner" verify --print-certs "${APK_DIR}/simplex-private-${VERSION}-arm64.apk"
          ls -la "${APK_DIR}/simplex-private-${VERSION}-arm64.apk"

      - name: Upload signed APK for the test job
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: apps/multiplatform/android/build/outputs/apk/foss/release/simplex-private-*-arm64.apk
          if-no-files-found: error

  two-phone-test:
    name: Two emulators, live ephemeral session
    runs-on: ubuntu-24.04-arm
    needs: build-apk
    timeout-minutes: 180
    # Only the latest run matters; cancel superseded ones (each push
    # of test files used to queue a full run).
    concurrency:
      group: two-phone-test
      cancel-in-progress: true

    env:
      AVD_A: phoneA
      AVD_B: phoneB
      SERIAL_A: emulator-5554
      SERIAL_B: emulator-5556

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ARM64 runners ship WITHOUT a preinstalled Android SDK (unlike
      # ubuntu-latest x86_64). Install cmdline-tools + platform-tools
      # (adb/sdkmanager); the driver installs the emulator package and
      # the arm64 system image itself. Sets ANDROID_HOME for the driver.
      - name: Set up Android SDK (cmdline-tools + platform-tools)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up JDK 17 (Maestro is a JVM app)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download signed APK from the build job
        uses: actions/download-artifact@v4
        with:
          name: test-apk
          path: test-apk

      - name: Install Maestro CLI
        # Pin Maestro 1.39.0 (last 1.x). The flows use 1.x YAML syntax
        # (contentDescription selectors, per-command timeout). Maestro 2.x
        # rejects both ("Unknown Property: contentDescription/timeout").
        # The install script reads MAESTRO_VERSION for a pinned release.
        run: |
          set -euo pipefail
          export MAESTRO_VERSION="1.39.0"
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Install Python QR decoder deps
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check opencv-python-headless

      - name: Run two-phone test
        run: |
          set -euo pipefail
          APK_PATH="$(ls test-apk/*.apk | head -n 1)"
          echo "Testing APK: $APK_PATH"
          bash tests/two-phone/run-two-phone-test.sh "$APK_PATH"

      - name: Upload test logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-phone-test-logs
          path: |
            /tmp/two-phone-test/**
          if-no-files-found: warn
