# Send a message in the currently open chat and assert it appears.
# Env: TEXT
# The send button has no visible text; matched via its contentDescription
# ("Send Message") through the text: selector (accessibilityText).
appId: chat.simplex.app
---
- tapOn:
    text: "Message"
- inputText: "${TEXT}"
- tapOn:
    text: "Send Message"
# The sender's own chat is SLOW to show the sent message under houdini
# (run 34: A's msg reached B at 11:46 but only appeared in A's own chat
# by ~11:49, ~5 min after Send). Wait up to 5 min, not 90s.
- extendedWaitUntil:
    visible:
      text: "${TEXT}"
    timeout: 300000
- assertVisible:
    text: "${TEXT}"
