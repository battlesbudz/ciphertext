# Open a 1:1 chat from the chat list.
# Env: CONTACT_NAME
appId: chat.ciphertext.app
---
- launchApp
- extendedWaitUntil:
    visible:
      text: "${CONTACT_NAME}"
    timeout: 90000
- assertVisible:
    text: "${CONTACT_NAME}"
- tapOn:
    text: "${CONTACT_NAME}"
- extendedWaitUntil:
    visible:
      text: "Message"
    timeout: 60000
- assertVisible:
    text: "Message"
