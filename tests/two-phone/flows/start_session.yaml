# Start a live (ephemeral) session from the open 1:1 chat:
# toolbar menu -> "Start live session", then assert the session banner.
appId: chat.simplex.app
---
- tapOn:
    contentDescription: "More"
- assertVisible:
    text: "Start live session"
    timeout: 60000
- tapOn:
    text: "Start live session"
- assertVisible:
    text:
      regex: "Live session.*wipes on exit"
    timeout: 90000
