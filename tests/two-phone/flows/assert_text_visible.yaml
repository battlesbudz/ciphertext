# Assert a specific text IS visible. Env: TEXT
appId: chat.simplex.app
---
# Delivery can take ~2 min under houdini (run 34); wait up to 5 min.
# Substring match: chat item node is "text + timestamp".
- extendedWaitUntil:
    visible:
      text: ".*${TEXT}.*"
    timeout: 300000
- assertVisible:
    text: ".*${TEXT}.*"
