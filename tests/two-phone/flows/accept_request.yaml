# Accept an incoming contact request (tap the request chat, tap Accept).
# Env: CONTACT_NAME (profile name of the requester)
appId: chat.simplex.app
---
- launchApp
- extendedWaitUntil:
    visible:
      text: "${CONTACT_NAME}"
    timeout: 180000
- assertVisible:
    text: "${CONTACT_NAME}"
- tapOn:
    text: "${CONTACT_NAME}"
- extendedWaitUntil:
    visible:
      text: "Accept contact request"
    timeout: 90000
- assertVisible:
    text: ".*Accept contact request.*"
- tapOn:
    text: "Accept"
- extendedWaitUntil:
    visible:
      text: "Message"
    timeout: 90000
- assertVisible:
    text: "Message"
