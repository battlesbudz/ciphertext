# Onboarding: first launch -> profile created -> chat list.
# Env: PROFILE_NAME (e.g. PhoneA / PhoneB)
# TRUE sequence (verified against app source, App.kt stage dispatch):
#   Step1 welcome ("Private and secure messaging." / "Get started")
#   Step2 profile ("Your profile" / field "Enter profile name…" / "Create profile")
#   Step3 network ("Your network" / "Continue")
#   Step4 commitments ("Network commitments" / "Accept")
#   -> chat list ("Tap to start a new chat")
# Maestro 1.39.0: text: is a FULL regex matched against text, hintText,
# AND accessibilityText (Android contentDescription). Long waits use
# extendedWaitUntil (no per-command timeout in 1.39.0).
# Stage transitions run Haskell API calls under houdini translation and can
# take 60-120s, so transition waits are generous (150-180s). Each action
# button gets a retry tap (optional) in case the first tap landed while the
# button was still disabled during recomposition; the retry is a no-op once
# the screen has changed. The "___settle___" extendedWaitUntil is a 3s
# sleep (never-matching text + optional).
appId: chat.simplex.app
---
- launchApp
- extendedWaitUntil:
    visible:
      text: ".*Private and secure messaging.*"
    timeout: 300000
- assertVisible:
    text: ".*Private and secure messaging.*"
- tapOn:
    text: "Get started"
- extendedWaitUntil:
    visible:
      text: ".*Your profile.*"
    timeout: 90000
- assertVisible:
    text: ".*Your profile.*"
- tapOn:
    text: "Enter profile name.*"
- inputText: "${PROFILE_NAME}"
- waitForAnimationToEnd
- tapOn:
    text: "Create profile"
- extendedWaitUntil:
    visible:
      text: "___settle___"
    timeout: 3000
    optional: true
- tapOn:
    text: "Create profile"
    optional: true
- extendedWaitUntil:
    visible:
      text: ".*Your network.*"
    timeout: 150000
- assertVisible:
    text: ".*Your network.*"
- tapOn:
    text: "Continue"
- extendedWaitUntil:
    visible:
      text: "___settle___"
    timeout: 3000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible:
      text: ".*Network commitments.*"
    timeout: 150000
- assertVisible:
    text: ".*Network commitments.*"
- tapOn:
    text: "Accept"
- extendedWaitUntil:
    visible:
      text: "___settle___"
    timeout: 3000
    optional: true
- tapOn:
    text: "Accept"
    optional: true
- extendedWaitUntil:
    visible:
      text: ".*Tap to start a new chat.*"
    timeout: 180000
- assertVisible:
    text: ".*Tap to start a new chat.*"
