# Onboarding: first launch -> profile created -> chat list.
# Env: PROFILE_NAME (e.g. PhoneA / PhoneB)
# TRUE sequence (verified against app source, App.kt stage dispatch):
#   Step1 welcome ("Private and secure messaging." / "Get started")
#   Step2 profile ("Your profile" / field "Enter profile name…" / "Create profile")
#   Step3 network ("Your network" / "Continue")
#   Step4 commitments ("Network commitments" / "Accept")
#   -> chat list ("Tap to start a new chat")
# Maestro 1.39.0: text: is a FULL regex matched against text, hintText,
# AND accessibilityText (Android contentDescription). Long waits use
# extendedWaitUntil (no per-command timeout in 1.39.0).
# Stage transitions run Haskell API calls under houdini translation and can
# take 60-120s, so transition waits are generous (150-180s).
# Two modal dialogs can appear and must be dismissed, or the next screen
# never shows:
#   - After "Create profile": a "Duplicate display name!" alert if the
#     creation was somehow submitted twice (dismiss with "OK"; the first
#     submission already created the profile).
#   - After "Continue": an "Instant notifications" info dialog explaining
#     background running (dismiss with "OK"; the stage then advances).
# NO retry taps: profile creation / Continue / Accept are NOT idempotent,
# and a second tap can double-submit (run 21: duplicate-name alert).
appId: chat.ciphertext.app
---
- launchApp
- extendedWaitUntil:
    visible:
      text: ".*Private and secure messaging.*"
    timeout: 300000
- assertVisible:
    text: ".*Private and secure messaging.*"
- tapOn:
    text: "Get started"
- extendedWaitUntil:
    visible:
      text: ".*Your profile.*"
    timeout: 90000
- assertVisible:
    text: ".*Your profile.*"
- tapOn:
    text: "Enter profile name.*"
- inputText: "${PROFILE_NAME}"
- waitForAnimationToEnd
- tapOn:
    text: "Create profile"
- extendedWaitUntil:
    visible:
      text: "Duplicate display name!"
    timeout: 15000
    optional: true
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible:
      text: ".*Your network.*"
    timeout: 150000
- assertVisible:
    text: ".*Your network.*"
- tapOn:
    text: "Continue"
- extendedWaitUntil:
    visible:
      text: "Instant notifications"
    timeout: 30000
    optional: true
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible:
      text: ".*Network commitments.*"
    timeout: 150000
- assertVisible:
    text: ".*Network commitments.*"
- tapOn:
    text: "Accept"
# NOTE (run 26): an unconditional optional "Back" tap here PROVED
# harmful — it found some "Back" node and tapped it, navigating away
# from the chat list, so the "Start new chat" assert then failed.
# Do NOT add a Back tap here. Run 25's one-off "Connect to desktop"
# modal (absent in run 26) must be handled in the driver if it ever
# recurs, gated on the modal actually being present.
# Post-onboarding chat list shows onboarding cards ("Talk to someone",
# etc.), not the "Tap to start a new chat" empty-state hint. The FAB
# ("Start new chat") is the stable chat-list signal — and Phase 2 taps it.
- extendedWaitUntil:
    visible:
      text: "Start new chat"
    timeout: 180000
- assertVisible:
    text: "Start new chat"
